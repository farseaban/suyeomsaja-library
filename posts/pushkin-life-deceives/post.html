<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삶이 그대를 속일 때 — 푸시킨</title>
<meta name="description" content="푸시킨의 시 「삶이 그대를 속일 때」를 여러 번역에 대한 의견을 참조해 새로 옮겼다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#33313F; --sub:#6E6B7B; --line:#E4E0DA; --paper:#FFFFFF; --card:#FBF9F6;
    --lav:#D9D3F7; --lav-d:#7466C2; --mint:#CDEBDD; --mint-d:#3F8F6E;
    --peach:#FBD9C6; --peach-d:#C06A45; --sky:#CFE3F6; --sky-d:#3E7DB0;
    --butter:#F8E8B0; --butter-d:#A9861F; --rose:#F6CCD8; --rose-d:#B24E6E;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
       font-size:17px;line-height:1.85;word-break:keep-all;-webkit-font-smoothing:antialiased}
  article{max-width:720px;margin:0 auto;padding:40px 20px 80px}
  .kicker{font-size:14px;color:var(--lav-d);font-weight:700;letter-spacing:.02em}
  h1{font-size:30px;line-height:1.35;margin:.3em 0 .5em;letter-spacing:-.02em}
  .meta{font-size:14px;color:var(--sub);margin-bottom:28px}
  .meta b{color:var(--ink)}
  h2{font-size:23px;line-height:1.4;margin:2.4em 0 .8em;padding-bottom:.35em;border-bottom:2px solid var(--line)}
  h3{font-size:19px;margin:1.8em 0 .6em}
  p{margin:0 0 1.15em}
  strong{background:linear-gradient(transparent 62%,var(--butter) 62%);font-weight:700}
  a{color:var(--sky-d);text-underline-offset:3px}
  ul,ol{padding-left:1.3em} li{margin:.3em 0}
  .lead-quote{font-size:21px;font-weight:700;margin:0 0 .8em}
  figure{margin:2em 0}
  figure svg{display:block;width:100%;height:auto}
  figcaption{font-size:14px;color:var(--sub);margin-top:.6em;line-height:1.6}
  sup.fn{font-size:.68em;line-height:0;margin-left:1px}
  sup.fn a{text-decoration:none;font-weight:700;color:var(--lav-d)}
  .key{background:#FFF8E0;border-left:5px solid var(--butter-d);border-radius:10px;padding:16px 20px;margin:1.6em 0}
  .key .label{font-weight:800;color:var(--butter-d)}
  .caution{background:#FDF0EA;border-left:5px solid var(--peach-d);border-radius:10px;padding:14px 20px;margin:1.6em 0;font-size:16px}
  table{width:100%;border-collapse:collapse;font-size:15px;margin:1.4em 0}
  th{background:var(--lav);text-align:left;padding:10px 12px}
  td{border-bottom:1px solid var(--line);padding:10px 12px}
  tr.hl td{background:#FDF0EA}
  blockquote.quote{margin:1.6em 0;padding:16px 22px;border-left:4px solid var(--sky-d);background:#F2F7FC;border-radius:0 10px 10px 0}
  blockquote.quote p{margin:0 0 .4em;font-size:17px}
  blockquote.quote cite{font-style:normal;font-size:14px;color:var(--sub)}
  .faq dt{font-weight:800;margin-top:1.2em}
  .faq dd{margin:.35em 0 0}
  .expert-note blockquote{margin:0;padding:22px 26px;background:var(--card);border-radius:14px;border:1px solid var(--line)}
  .expert-note blockquote p:last-child{margin-bottom:0}
  hr{border:0;border-top:1px dashed var(--line);margin:2.6em 0}
  .disclaimer{font-size:14px;color:var(--sub);background:var(--card);padding:12px 16px;border-radius:10px}
  .refs{font-size:14px;line-height:1.7;margin-top:2.4em}
  .refs h3{font-size:16px}
  .refs li:target{background:#FFF8E0}
  .refs a.back{text-decoration:none;margin-left:4px}
  @media (max-width:520px){ body{font-size:16px} h1{font-size:25px} h2{font-size:20px} }
</style>
</head>
<body>
<article>
<h1>삶이 그대를 속일 때 — 푸시킨</h1>
<div class="meta">2020-08-18 · 약 1분 분량 · 글 수염사자</div>

<p>삶이 그대를 속일 때,<br>
슬퍼하거나 노여워하지 말라.<br>
우울한 날에는 순응하라.<br>
즐거운 날은 반드시 올 터이니.</p>

<p>영혼은 내일 속에 살기에<br>
오늘이 우울한 것.<br>
모든 것은 찰나에 사라지기에,<br>
지나간 것은 훗날 추억되리라.</p>

<p class="disclaimer">여러 번역에 대한 의견을 참조하여 새로 번역해 봄</p>

</article>
</body>
</html>
