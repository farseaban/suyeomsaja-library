<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>꽃의 설계</title><style>p{margin:0}</style></head>
<body><article>
<div class="kicker">자연 읽기</div>
<h1>꽃은 번식을 어떻게 설계하는가</h1>
<p class="lead-quote">"꽃은 왜 예쁠까요?"</p>
<p>국화과 식물의 꽃 한 송이는 사실 수백 개의 작은 꽃이 모인 꽃차례입니다. 이 구조 덕분에 곤충은 한 번 내려앉아 많은 꽃의 꽃가루를 한꺼번에 옮기고, 식물은 적은 방문으로도 수분에 성공합니다. 이 글은 그 설계를 따라갑니다.</p>
</article></body></html>
